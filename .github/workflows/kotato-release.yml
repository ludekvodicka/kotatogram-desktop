name: Kotatogram Release (Windows x64).

# Two-phase build, because a cold third-party library build does not fit
# into the 6 hour limit of one GitHub-hosted job.
#
#   phase: libs  -> builds and caches the third-party libraries only.
#                   Re-run until the "Libraries." step ends green. Every run
#                   resumes where the previous one stopped, because
#                   prepare.py keys every stage in Libraries/cache_keys.
#   phase: app   -> restores that cache and builds Kotatogram.exe in Release.
#
# Unlike the upstream win.yml this workflow:
#   - prepares the libraries WITHOUT "skip-release", so Release variants exist,
#   - builds CMAKE_CONFIGURATION_TYPES=Release instead of Debug,
#   - uses real API credentials instead of TDESKTOP_API_TEST,
#   - disables the auto-updater, so the binary never replaces itself.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "libs = build and cache third-party libraries; app = build Kotatogram Release"
        type: choice
        options: [libs, app]
        default: libs

permissions:
  contents: read
  actions: write

concurrency:
  group: kotato-release-windows
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      CACHE_PREFIX: "win-x64-qt6-release"
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Free up runner disk space.
        shell: pwsh
        run: |
          $targets = @(
            'C:\Android',
            'C:\Miniconda',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\node',
            'C:\Program Files (x86)\Android'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Write-Host "Removing $t"
              Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C | Select-Object Used,Free

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Drops /Zi from the Debug library builds. Saves disk and link time,
          # the Debug libraries are only a by-product for us.
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore libraries cache.
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ env.CACHE_KEY }}-
            ${{ env.CACHE_PREFIX }}-

      - name: Prune old caches.
        shell: bash
        run: |
          # The repository cache limit is 10 GB. The restore above already put
          # the files on disk, so dropping the stored entries frees the whole
          # quota for the entry this run saves.
          gh cache delete --all --repo "$GITHUB_REPOSITORY" || true

      - name: Libraries.
        timeout-minutes: 270
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Disk space after libraries.
        if: always()
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free

      - name: Save libraries cache.
        if: always() && inputs.phase == 'libs'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.TBUILD }}\Libraries
          key: ${{ env.CACHE_PREFIX }}-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Kotatogram Desktop build.
        if: inputs.phase == 'app'
        env:
          API_ID: ${{ secrets.TG_API_ID || '611335' }}
          API_HASH: ${{ secrets.TG_API_HASH || 'd524b414d21f4d37f08684c1df41ac9c' }}
        run: |
          C:
          cd %userprofile%\TBuild\%REPO_NAME%\Telegram

          call configure.bat x64 qt6 ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Collect artifact.
        if: inputs.phase == 'app'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Kotatogram.exe artifact\
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: inputs.phase == 'app'
        with:
          name: Kotatogram-x64-Release-${{ github.sha }}
          path: artifact\
          retention-days: 90
